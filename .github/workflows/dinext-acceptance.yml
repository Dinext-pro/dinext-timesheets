name: Dinext acceptance
on:
  pull_request: {}
  push:
    branches: [feat/dinext_workflow]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deadline-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cypress:
    name: Cypress acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pci" --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      CI: 'true'
      DINEXT_DEPLOY_ENABLED: 'false'
      DINEXT_NOTIFICATIONS_ENABLED: 'false'
      DINEXT_DOCS_AGENT_ENABLED: '0'
      DINEXT_WIKI_PUBLISH_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: c080095bd61ea5cc89b1bb9ef12e809ea00e68ce
          path: ci-support
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools xvfb xauth libgtk-3-0t64 libgbm1 libnss3 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libnotify4
          python -m pip install frappe-bench==5.31.0
          npm install --global yarn@1.22.22
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/frappe
          ln -s "$RUNNER_TEMP/dinext-test-bench" /home/frappe/frappe-bench
      - name: Build disposable bench and run deadline integration tests
        run: |
          # This branch uses the approval engine from dinext-common's workflow branch.
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('ci-support/.github/ci/public-apps.json')
          catalog = json.loads(path.read_text())
          catalog['dinext_common']['ci_sha'] = '948355ac2124081c74c873ea6620521a2e206abb'
          path.write_text(json.dumps(catalog))

          # The workflow branch exports Standard Dashboard Charts as fixtures.
          # Import those fixtures in developer mode on the disposable bench.
          runner = Path('ci-support/.github/ci/bench_tests.py')
          code = runner.read_text()
          write_config = 'common.write_text(json.dumps(settings))'
          assert code.count(write_config) == 1
          code = code.replace(write_config, "settings['developer_mode'] = 1\n" + write_config)

          # Run deadline acceptance independently of the older workflow unit suite.
          app_selector = "'--app', app, '--junit-xml-output='"
          module_selector = "'--module', 'dinext_timesheets.tests.test_deadline_integration', '--junit-xml-output='"
          assert code.count(app_selector) == 1
          runner.write_text(code.replace(app_selector, module_selector))
          PY
          python ci-support/.github/ci/bench_tests.py "$GITHUB_WORKSPACE"
      - name: Run calendar tests
        run: |
          cd "$RUNNER_TEMP/dinext-test-bench/sites"
          ../env/bin/python -m unittest dinext_timesheets.tests.test_deadlines
      - name: Run reminder contract tests
        run: node tests/js/deadline_reminder.test.cjs
      - name: Run six browser scenarios on this PR revision
        run: python .github/ci/deadline_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timesheet-deadline-acceptance
          path: |
            ${{ runner.temp }}/*-unit.xml
            ${{ runner.temp }}/deadline-acceptance/
          if-no-files-found: error
          retention-days: 14
